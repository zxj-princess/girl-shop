<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务与管理 - 粉系衣橱</title><link rel="stylesheet" href="lib/element-ui/index.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/platform.css"><script src="lib/axios.min.js"></script><script src="js/common.js"></script></head><body><div id="app"><script>document.write(navbarHTML())</script><main class="platform-shell"><header><span>粉系衣橱 · 服务中心</span><h1>提醒偏好与平台管理</h1><p>交易进展有迹可循，每一次处理都有记录。</p></header><section class="platform-card"><h2>我的提醒偏好</h2><el-switch v-model="priceEnabled" active-text="收藏降价与重新上架提醒" @change="savePreference"></el-switch><p class="muted">仅提醒收藏中的商品，可随时关闭。</p></section><p v-if="error" role="alert">{{error}}</p><template v-if="admin"><section class="platform-card"><h2>运行概况</h2><el-button size="small" @click="loadDashboard">刷新</el-button><div class="health-grid"><span v-for="(ok,name) in health" :key="name" :class="{offline:!ok}">{{healthLabel(name)}} · {{ok?'正常':'未连接'}}</span></div><div v-for="(rows,key) in dashboard" :key="key"><h3>{{metricLabel(key)}}</h3><p v-if="!Array.isArray(rows)">{{rows}}</p><div v-else class="metric-row" v-for="(row,i) in rows" :key="i"><span>{{row.status||row.rating||row.field}}</span><strong>{{row.total}} 条</strong><small v-if="row.seconds!=null">平均状态耗时 {{row.seconds}} 秒</small></div></div></section><section class="platform-card"><el-tabs v-model="kind" @tab-click="changeTab"><el-tab-pane label="举报处理" name="reports"></el-tab-pane><el-tab-pane label="售后争议" name="cases"></el-tab-pane><el-tab-pane label="商品审核" name="products"></el-tab-pane><el-tab-pane label="通知投递" name="delivery"></el-tab-pane><el-tab-pane label="账号管理" name="users"></el-tab-pane><el-tab-pane label="操作审计" name="audit"></el-tab-pane></el-tabs><p v-if="!rows.length">暂无记录</p><article class="management-row" v-for="row in rows" :key="row.id"><strong>{{row.title||row.kind||row.targetType||'记录'}} #{{row.id}}</strong><span>{{row.status||row.action}}</span><p>{{row.reason||row.description||row.note||row.lastError}}</p><p v-if="row.result">处理结果：{{row.result}}</p><div v-if="row.images" class="evidence"><el-image v-for="url in row.images.split(',')" :key="url" :src="imgSrc(url)" :preview-src-list="row.images.split(',').map(imgSrc)"></el-image></div><template v-if="kind==='reports'&&row.status==='PENDING'"><el-button size="small" @click="act(row,'UPHELD')">举报成立</el-button><el-button size="small" @click="act(row,'DISMISSED')">驳回举报</el-button></template><template v-if="kind==='cases'"><el-button size="small" @click="act(row,'RETURN_REQUIRED')">协调退货</el-button><el-button size="small" @click="act(row,'REJECTED')">驳回争议</el-button></template><el-button v-if="kind==='products'&&row.status===1" size="small" @click="act(row,'TAKEDOWN')">审核下架</el-button><el-button v-if="kind==='users'" size="small" @click="act(row,row.status==='BANNED'?'UNBAN':'BAN')">{{row.status==='BANNED'?'解除限制':'限制账号'}}</el-button><el-button v-if="kind==='delivery'&&row.status==='DEAD'" size="small" @click="act(row,'RETRY')">重新投递</el-button></article><el-button :disabled="page<=1" @click="page--;loadRows()">上一页</el-button><span>第 {{page}} 页</span><el-button :disabled="rows.length<20" @click="page++;loadRows()">下一页</el-button></section></template><section v-else class="platform-card"><p>管理功能仅向已配置的管理员开放。</p></section></main></div><script src="lib/vue.min.js"></script><script src="lib/element-ui/index.js"></script><script src="js/platform.js"></script></body></html>

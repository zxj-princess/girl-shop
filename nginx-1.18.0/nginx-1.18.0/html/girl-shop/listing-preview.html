<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品预览 - 粉系衣橱</title><link rel="stylesheet" href="lib/element-ui/index.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/ai-listing.css"><script src="lib/axios.min.js"></script><script src="js/common.js"></script></head><body><div id="app"><script>document.write(navbarHTML())</script><main class="ai-shell" v-loading="loading"><header class="ai-header"><div><span class="ai-eyebrow">PRIVATE PREVIEW · 仅本人可见</span><h1>好物发布前，再看一眼</h1><p>这是一份商品草稿，确认发布前不会被其他用户看到。</p></div><a :href="'trade.html'+(draftId?'?draftFocus='+encodeURIComponent(draftId):'')+'#drafts'">我的草稿 →</a></header><div v-if="error" class="ai-card"><p role="alert">{{error}}</p><el-button @click="load">重试</el-button></div><template v-else-if="draft"><div class="ai-warning" v-for="(warning,i) in draft.aiWarnings||[]" :key="i">{{warning}}</div><div class="ai-layout"><section class="ai-card"><el-image class="preview-main-image" :src="imgSrc(activeImage)" :preview-src-list="(draft.images||[]).map(imgSrc)" fit="contain"></el-image><div class="ai-images"><button v-for="url in draft.images" :key="url" @click="activeImage=url" style="border:0;background:transparent;cursor:pointer"><img :src="imgSrc(url)" alt="商品实拍"></button></div><h2>商品描述</h2><p class="ai-description">{{draft.description||'请补充商品描述'}}</p><details v-if="draft.aiSourceText"><summary>查看原始说明</summary><p class="ai-description">{{draft.aiSourceText}}</p></details></section><section class="ai-card"><h2>{{draft.title||'请补充商品标题'}}</h2><p class="ai-price">{{draft.price?'¥'+formatMoney(draft.price):'价格待确认'}}</p><dl class="ai-facts"><dt>原价</dt><dd>{{draft.originalPrice!=null?'¥'+formatMoney(draft.originalPrice):'未提供'}}</dd><dt>分类</dt><dd>{{categoryName}}</dd><dt>尺码</dt><dd>{{draft.size||'待填写'}}</dd><dt>成色</dt><dd>{{conditionMap[draft.condition]||'待确认'}}</dd><dt>品牌</dt><dd>{{draft.brand||'未提供'}}</dd><dt>实测信息</dt><dd>{{draft.measurements||'未提供'}}</dd><dt>瑕疵说明</dt><dd>{{draft.defects||'未说明，请核实'}}</dd></dl><ai-flash-settings v-model="draft" :disabled="saving||publishing" @input="flashDirty=true"></ai-flash-settings><el-button v-if="flashDirty" size="small" :loading="saving" :disabled="publishing" @click="saveFlashSettings">保存捡漏设置</el-button><div v-if="!complete" class="ai-warning">发布前请补齐标题、描述、分类、尺码、成色、价格和图片。</div><label class="ai-check"><input type="checkbox" v-model="confirmed">我已核对商品实拍、价格、尺码、成色和瑕疵，确认信息真实。</label><div class="ai-actions"><el-button type="primary" :loading="publishing" :disabled="!complete||!confirmed||publishing" @click="publish">确认发布</el-button><a :href="'publish.html?draft='+draftId">继续编辑 →</a></div><p class="muted">捡漏仅在你主动开启并确认发布后生效。</p><p v-if="publishError" class="ai-error" role="alert">{{publishError}}</p></section></div></template></main></div><script src="lib/vue.min.js"></script><script src="lib/element-ui/index.js"></script><script src="js/flash-settings.js"></script><script src="js/listing-preview.js"></script></body></html>

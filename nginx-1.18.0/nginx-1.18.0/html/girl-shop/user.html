<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 粉系衣橱</title>
<link rel="stylesheet" href="lib/element-ui/index.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .user-card { display: flex; align-items: center; justify-content: space-between; padding: 28px 30px; margin-top: 10px; }
  .user-left { display: flex; align-items: center; gap: 18px; }
  .avatar-pink { background: linear-gradient(135deg, var(--pink-light), var(--pink)); color: #fff; font-size: 26px; flex-shrink: 0; }
  .user-name { font-size: 24px; font-weight: bold; color: #333; }
  .user-phone { color: #999; font-size: 14px; margin-top: 8px; }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 24px; }
  @media (max-width: 768px) { .quick-grid { grid-template-columns: repeat(2, 1fr); } }
  .quick-item { padding: 28px 0; text-align: center; cursor: pointer; }
  .quick-icon { font-size: 38px; line-height: 1; }
  .quick-label { margin-top: 12px; font-size: 15px; color: #555; }
  .quick-item:hover .quick-label { color: var(--pink); }
</style>
<script src="lib/axios.min.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div id="app">
  <script>document.write(navbarHTML())</script><div class="gs-container mine-shortcuts"><a href="trade.html#blocks">黑名单管理</a><a href="trade.html#reports">我的举报</a></div>
  <div class="gs-container">
    <!-- 用户卡片 -->
    <div class="gs-card user-card" v-loading="loading">
      <div class="user-left">
        <el-avatar v-if="user.icon" :size="60" :src="user.icon"></el-avatar>
        <el-avatar v-else :size="60" icon="el-icon-user-solid" class="avatar-pink"></el-avatar>
        <div>
          <div class="user-name">{{ user.nickName || '用户' }}</div>
          <div class="user-phone">📱 {{ user.phone || '暂无手机号' }}</div>
        </div>
      </div>
      <el-button type="primary" round icon="el-icon-edit" @click="openEdit">编辑资料</el-button>
    </div>

    <!-- 快捷入口 -->
    <div class="quick-grid">
      <div class="gs-card quick-item" v-for="q in entries" :key="q.url" @click="go(q.url)">
        <div class="quick-icon">{{ q.icon }}</div>
        <div class="quick-label">{{ q.label }}</div>
      </div>
    </div>

    <!-- 编辑资料弹窗 -->
    <el-dialog title="编辑资料" :visible.sync="dialogVisible" width="480px">
      <el-form :model="form" :rules="rules" ref="form" label-width="80px">
        <el-form-item label="昵称" prop="nickName">
          <el-input v-model="form.nickName" maxlength="20" placeholder="请输入昵称"></el-input>
        </el-form-item>
        <el-form-item label="性别">
          <el-radio-group v-model="form.gender">
            <el-radio :label="true">男</el-radio>
            <el-radio :label="false">女</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="城市">
          <el-input v-model="form.city" maxlength="30" placeholder="请输入所在城市"></el-input>
        </el-form-item>
        <el-form-item label="简介">
          <el-input type="textarea" :rows="3" maxlength="200" v-model="form.introduce" placeholder="介绍一下自己吧~"></el-input>
        </el-form-item>
      </el-form>
      <div slot="footer">
        <el-button @click="dialogVisible = false">取 消</el-button>
        <el-button type="primary" :loading="saving" @click="saveProfile">保 存</el-button>
      </div>
    </el-dialog>
  </div>
  <script>document.write(footerHTML())</script>
</div>
<script src="lib/vue.min.js"></script>
<script src="lib/element-ui/index.js"></script>


<script>
if (!isLoggedIn()) { location.href = 'login.html' }

Vue.use(ELEMENT); registerPageUtilities()

new Vue({
  el: '#app',
  data() {
    return {
      loading: false,
      saving: false,
      dialogVisible: false,
      user: {},
      info: {},
      form: { nickName: '', gender: true, city: '', introduce: '' },
      rules: {
        nickName: [{ required: true, message: '请输入昵称', trigger: 'blur' }]
      },
      entries: [
        { icon: '📦', label: '我的发布', url: 'my-publish.html' },
        { icon: '⭐', label: '我的收藏', url: 'my-favorite.html' },
        { icon: '📍', label: '收货地址', url: 'address.html' },
        { icon: '🧾', label: '我的订单', url: 'orders.html' },
        { icon: '🔔', label: '消息通知', url: 'notice.html' },
        { icon: '👥', label: '我的关注', url: 'my-follows.html' },
        { icon: '👗', label: '捡漏专区', url: 'flash.html' },
        { icon: '📸', label: '发布商品', url: 'publish.html' }
      ]
    }
  },
  methods: {
    navCmd,
    go(url) { location.href = url },
    loadUser() {
      this.loading = true
      request.get('/user/me').then(res => { this.user = res.data || {} })
        .catch(() => {})
        .then(() => { this.loading = false })
      request.get('/user/info').then(res => { this.info = res.data || {} }).catch(() => {})
    },
    openEdit() {
      this.form.nickName = this.user.nickName || ''
      this.form.gender = typeof this.info.gender === 'boolean' ? this.info.gender : true
      this.form.city = this.info.city || ''
      this.form.introduce = this.info.introduce || ''
      this.dialogVisible = true
      this.$nextTick(() => { this.$refs.form && this.$refs.form.clearValidate() })
    },
    saveProfile() {
      this.$refs.form.validate(valid => {
        if (!valid) return
        this.saving = true
        request.put('/user/info', {
          city: this.form.city,
          introduce: this.form.introduce,
          gender: this.form.gender
        }).then(() => {
          const nick = (this.form.nickName || '').trim()
          if (nick && nick !== (this.user.nickName || '')) {
            return request.put('/user/nickname?nickName=' + encodeURIComponent(nick)).then(res => {
              const u = getUser()
              const latest = res.data || {}
              if (latest.nickName !== undefined) u.nickName = latest.nickName
              if (latest.icon !== undefined) u.icon = latest.icon
              setLogin(getToken(), u)
            })
          }
        }).then(() => {
          this.saving = false
          this.dialogVisible = false
          msgSuccess('资料保存成功')
          this.loadUser()
        }).catch(() => { this.saving = false })
      })
    }
  },
  mounted() {
    if (isLoggedIn()) this.loadUser()
  }
})
</script>
</body>
</html>

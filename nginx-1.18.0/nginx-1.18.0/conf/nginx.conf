# ============================================================
# 粉系衣橱（二手服装交易平台） Nginx 1.18 配置
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream backend {
        server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
    }

    server {
        listen       8090;
        server_name  localhost;

        # 图片：长缓存
        location /imgs/ {
            alias  html/girl-shop/imgs/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # JS/CSS/HTML 开发期全禁缓存，改了刷新就生效
        location ~* \.(js|css|html)$ {
            root   html/girl-shop;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            root   html/girl-shop;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Authenticated WebSocket; query contains a one-use 30-second ticket.
        location = /api/ws/messages {
            access_log off;
            proxy_pass http://backend/ws/messages;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
        }

        # API 反向代理
        location /api {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite /api(/.*) $1 break;
            proxy_pass http://backend;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}

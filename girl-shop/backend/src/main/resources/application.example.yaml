server:
  port: 8081
spring:
  application:
    name: girl-shop
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/girl_shop?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: "REPLACE_WITH_YOUR_LOCAL_VALUE"
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 2s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    connection-timeout: 3s
    username: admin
    password: "REPLACE_WITH_YOUR_LOCAL_VALUE"
    # 开启发布确认，保证秒杀消息可靠投递
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段

mybatis-plus:
  type-aliases-package: com.girlshop.entity

images:
  root: "${SHOP_IMAGE_ROOT:D:/shixi/girl shop/nginx-1.18.0/nginx-1.18.0/html/girl-shop/imgs}"

logging:
  pattern:
    level: "%5p [request=%X{requestId:-background}]"
  file:
    name: .runtime/application.log
  level:
    com.girlshop: INFO

# Server-side only. Choose a vision model supporting Responses + strict JSON Schema.
shop:
  ai:
    api-key: "REPLACE_WITH_YOUR_LOCAL_VALUE"
    model: qwen3.7-plus
    endpoint: https://ws-i2su1u96qy1c1y8k.cn-beijing.maas.aliyuncs.com/compatible-mode/v1